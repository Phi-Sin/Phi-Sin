name: Update public profile signal
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2,14 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update-profile.mjs'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: public-profile-signal
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public snapshot
        run: node scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit generated files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/telemetry.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh public profile signal'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
